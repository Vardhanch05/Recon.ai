name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Validate Schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: recon_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/recon_ai_test
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite (SQLite & Unit Tests)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: testing
        run: |
          pytest -v

      - name: Run Test Suite against live PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/recon_ai_test
          ENVIRONMENT: testing
        run: |
          pytest -v

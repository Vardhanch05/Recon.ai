<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="600" y="45" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">ReconAI Architecture</text>
  <text x="600" y="70" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle">Multi-Source Settlement Reconciliation Engine &amp; Cryptographic Audit Pipeline</text>

  <!-- 1. Ingestion -->
  <g transform="translate(30, 100)">
    <rect width="210" height="470" rx="16" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="15" y="15" width="180" height="34" rx="8" fill="#0284C7"/>
    <text x="105" y="37" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. INGESTION LAYER</text>

    <!-- Sub-card 1 -->
    <rect x="15" y="65" width="180" height="95" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="105" y="95" font-size="13" font-weight="700" fill="#0369A1" text-anchor="middle">Multipart CSV Upload</text>
    <text x="105" y="115" font-size="11" fill="#64748B" text-anchor="middle">Razorpay Settlement</text>
    <text x="105" y="132" font-size="11" fill="#64748B" text-anchor="middle">+ Merchant Ledger CSV</text>

    <!-- Sub-card 2 -->
    <rect x="15" y="175" width="180" height="95" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="105" y="205" font-size="13" font-weight="700" fill="#0369A1" text-anchor="middle">Decimal Normalization</text>
    <text x="105" y="225" font-size="11" fill="#64748B" text-anchor="middle">clean_currency() Quantized</text>
    <text x="105" y="242" font-size="11" fill="#64748B" text-anchor="middle">Decimal("0.01") Precision</text>

    <!-- Sub-card 3 -->
    <rect x="15" y="285" width="180" height="95" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="105" y="315" font-size="13" font-weight="700" fill="#0369A1" text-anchor="middle">Database Storage</text>
    <text x="105" y="335" font-size="11" fill="#64748B" text-anchor="middle">settlement_records</text>
    <text x="105" y="352" font-size="11" fill="#64748B" text-anchor="middle">and order_ledger tables</text>

    <!-- Sub-card 4 -->
    <rect x="15" y="395" width="180" height="60" rx="10" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="105" y="420" font-size="11" font-weight="700" fill="#0369A1" text-anchor="middle">Idempotency Guard</text>
    <text x="105" y="438" font-size="10" fill="#0284C7" text-anchor="middle">confirm_overwrite check</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <path d="M 240 335 L 268 335" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Deterministic Matching Engine -->
  <g transform="translate(270, 100)">
    <rect width="210" height="470" rx="16" fill="#F0FDF4" stroke="#059669" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="15" y="15" width="180" height="34" rx="8" fill="#059669"/>
    <text x="105" y="37" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. MATCHING ENGINE</text>

    <rect x="15" y="65" width="180" height="110" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="105" y="95" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">Deterministic Matching</text>
    <text x="105" y="118" font-size="11" fill="#64748B" text-anchor="middle">Order ID Exact Match</text>
    <text x="105" y="135" font-size="11" fill="#64748B" text-anchor="middle">Ref ID + Time Window</text>
    <text x="105" y="155" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">~80% Volume (&lt;200ms)</text>

    <rect x="15" y="190" width="180" height="110" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="105" y="220" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">Centralized Math</text>
    <text x="105" y="243" font-size="11" fill="#64748B" text-anchor="middle">calculate_difference()</text>
    <text x="105" y="260" font-size="11" fill="#64748B" text-anchor="middle">Sanity check fee drift</text>
    <text x="105" y="278" font-size="11" fill="#047857" text-anchor="middle">No ad-hoc float math</text>

    <rect x="15" y="315" width="180" height="140" rx="10" fill="#DCFCE7" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="105" y="343" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Atomic Status Guard</text>
    <text x="105" y="365" font-size="11" fill="#065F46" text-anchor="middle">Single-state transition</text>
    <text x="105" y="385" font-size="10" fill="#047857" text-anchor="middle">WHERE status = 'uploaded'</text>
    <text x="105" y="415" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">Prevents Race (409)</text>
  </g>

  <!-- Connection 2 -> 3 (Exceptions 20%) -->
  <path d="M 480 335 L 508 335" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="477" y="308" width="34" height="18" rx="4" fill="#8B5CF6"/>
  <text x="494" y="321" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">20%</text>

  <!-- 3. AI Discrepancy Reasoning Engine -->
  <g transform="translate(510, 100)">
    <rect width="210" height="470" rx="16" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="15" y="15" width="180" height="34" rx="8" fill="#7C3AED"/>
    <text x="105" y="37" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. AI REASONING</text>

    <rect x="15" y="65" width="180" height="100" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <text x="105" y="93" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="middle">LLM Reasoner</text>
    <text x="105" y="113" font-size="11" fill="#64748B" text-anchor="middle">Multi-hypothesis checks</text>
    <text x="105" y="130" font-size="11" fill="#64748B" text-anchor="middle">MDR / GST / Refunds / FX</text>
    <text x="105" y="148" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">5-min Lease Auto-Recovery</text>

    <rect x="15" y="175" width="180" height="100" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <text x="105" y="200" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="middle">Isolated Math Tool</text>
    <text x="105" y="220" font-size="11" fill="#64748B" text-anchor="middle">calculate_difference()</text>
    <text x="105" y="238" font-size="11" fill="#64748B" text-anchor="middle">Server-side execution</text>
    <text x="105" y="258" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Zero Math Hallucination</text>

    <rect x="15" y="285" width="180" height="170" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="105" y="312" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="middle">Reasoning Cards</text>
    <text x="105" y="333" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">14% AI Resolved</text>
    <text x="105" y="350" font-size="10" fill="#64748B" text-anchor="middle">Confidence &gt;= 0.90</text>
    <text x="105" y="375" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">6% Unresolved</text>
    <text x="105" y="392" font-size="10" fill="#64748B" text-anchor="middle">Genuinely anomalous</text>
    <text x="105" y="425" font-size="10" font-weight="700" fill="#5B21B6" text-anchor="middle">Chunked (CHUNK_SIZE=10)</text>
  </g>

  <!-- Connection 3 -> 4 -->
  <path d="M 720 335 L 748 335" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Maker-Checker Governance -->
  <g transform="translate(750, 100)">
    <rect width="210" height="470" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="15" y="15" width="180" height="34" rx="8" fill="#D97706"/>
    <text x="105" y="37" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. DUAL GOVERNANCE</text>

    <rect x="15" y="65" width="180" height="110" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="105" y="93" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">Maker Review</text>
    <text x="105" y="115" font-size="11" fill="#64748B" text-anchor="middle">Inspects Discrepancies</text>
    <text x="105" y="133" font-size="11" fill="#64748B" text-anchor="middle">POST /propose</text>
    <text x="105" y="153" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">pending_authorization</text>

    <rect x="15" y="190" width="180" height="140" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="105" y="218" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">Checker Authorize</text>
    <text x="105" y="240" font-size="11" fill="#64748B" text-anchor="middle">Segregation of Duties</text>
    <text x="105" y="265" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">403 Forbidden Guard</text>
    <text x="105" y="283" font-size="10" fill="#78350F" text-anchor="middle">proposed_by == authorizer</text>
    <text x="105" y="308" font-size="10" fill="#64748B" text-anchor="middle">Identity checked 1st</text>

    <rect x="15" y="345" width="180" height="110" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="105" y="375" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">General Ledger</text>
    <text x="105" y="398" font-size="11" fill="#64748B" text-anchor="middle">Journal Posting Gate</text>
    <text x="105" y="420" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">human_approved</text>
  </g>

  <!-- Connection 4 -> 5 -->
  <path d="M 960 335 L 988 335" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Cryptographic Audit Chain -->
  <g transform="translate(990, 100)">
    <rect width="180" height="470" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="15" y="15" width="150" height="34" rx="8" fill="#DC2626"/>
    <text x="90" y="37" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5. AUDIT CHAIN</text>

    <rect x="15" y="65" width="150" height="110" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
    <text x="90" y="93" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">Singleton Head Lock</text>
    <text x="90" y="115" font-size="10" fill="#64748B" text-anchor="middle">AuditChainHead</text>
    <text x="90" y="133" font-size="10" fill="#64748B" text-anchor="middle">Serialized Append</text>
    <text x="90" y="153" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Zero Deadlocks</text>

    <rect x="15" y="190" width="150" height="135" rx="10" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="90" y="215" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">Forward Hash Chain</text>
    <text x="90" y="238" font-size="10" fill="#7F1D1D" text-anchor="middle">SHA-256 forward link</text>
    <text x="90" y="258" font-size="9" fill="#991B1B" text-anchor="middle">curr = H(prev + payload)</text>
    <text x="90" y="285" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Immutable Events</text>
    <text x="90" y="303" font-size="9" fill="#7F1D1D" text-anchor="middle">ORM delete/edit guard</text>

    <rect x="15" y="340" width="150" height="115" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
    <text x="90" y="370" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">Tamper Detection</text>
    <text x="90" y="395" font-size="10" fill="#64748B" text-anchor="middle">GET /audit-log/verify</text>
    <text x="90" y="420" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Automated Audit</text>
  </g>
</svg>
